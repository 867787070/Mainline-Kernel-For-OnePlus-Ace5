name: Build Linux 7.3 for OnePlus Ace5 (UEFI)

on:
  push:
    paths:
      - 'arch/arm64/**'
      - '.github/workflows/*.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses-dev bc flex libssl-dev \
          libelf-dev bison openssl dwarves cpio python3 python3-pip gcc-aarch64-linux-gnu zstd

    - name: Build kernel + dtb
      run: |
        set -e
        rm -rf build
        mkdir -p build
        cd build
        # 使用仓库自带的 defconfig
        cp ../arch/arm64/configs/defconfig .config
        # 启用 sm8650/giulia 本地版本
        echo "CONFIG_LOCALVERSION=-giulia" >> .config
        # 同步 .config 到最新（Makefile 定义了该目标）
        make -f ../Makefile -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
        make -f ../Makefile -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image dtbs modules

    - name: Build firmware
      # firmware 为目标不存在于该仓库，作为可选项保留（set -e 下 || true 不会中断）；
      # 如需固件请提前放入 build/firmware/ 目录或手动下载 Qualcomm blobs
      run: |
        set -e
        cd build
        make -f ../Makefile -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- firmware || true

    - name: Install modules
      run: |
        set -e
        cd build
        make -f ../Makefile -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_install INSTALL_MOD_PATH=./modules

    - name: Strip and 整理产物
      run: |
        set -e
        cd build
        mkdir -p dist
        # 1. 压缩 Image（可用 xz 或 zstd，zstd 更快）
        cp arch/arm64/boot/Image dist/
        zstd -19 -T0 dist/Image -o dist/Image.zst
        # 2. 复制设备树
        cp arch/arm64/boot/dts/qcom/sm8650-oneplus-giulia.dtb dist/
        # 3. 复制 firmware（可选，目录不存在时跳过）
        cp -r firmware dist/ || true
        # 4. 复制 modules 并 strip 调试信息（节省 ~40%）
        cp -r modules dist/ || true
        find dist/modules -name "*.ko" -exec aarch64-linux-gnu-strip --strip-debug {} \;
        echo "=== 产物大小（按类型）==="
        ls -lh dist/ && echo && echo "modules 大小:" && du -sh dist/modules/
        echo "=== 文件清单（前 30 条）==="
        find dist -type f | head -30

    - name: 打包压缩产物
      run: |
        set -e
        cd build/dist
        tar cJf kernel-sm8650-giulia.tar.xz \
          Image.zst \
          sm8650-oneplus-giulia.dtb \
          modules
        ls -lh kernel-sm8650-giulia.tar.xz

    - name: 上传产物
      uses: actions/upload-artifact@v4
      with:
        name: kernel-sm8650-giulia
        path: build/dist/kernel-sm8650-giulia.tar.xz
        retention-days: 7
