name: Build giulia mainline kernel

on:
  workflow_dispatch:
  push:
    branches: [ nfc-fix-giulia, main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu flex bison bc libssl-dev dwarves \
            kmod cpio xz-utils zip

      - name: Build kernel (Image + dtb + modules)
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make defconfig
          make -j"$(nproc)" Image
          make -j"$(nproc)" qcom/sm8650-oneplus-giulia.dtb
          make -j"$(nproc)" modules
          KVER="$(make -s kernelrelease)"
          echo "KVER=${KVER}" >> "$GITHUB_ENV"

          mkdir -p out
          cp arch/arm64/boot/Image out/Image
          cp arch/arm64/boot/dts/qcom/sm8650-oneplus-giulia.dtb out/sm8650-oneplus-giulia.dtb
          make INSTALL_MOD_PATH="$PWD/out/modules" modules_install
          tar -C out/modules/lib/modules -czf "out/${KVER}-giulia-modules.tar.gz" "$KVER"
          ls -la out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: giulia-kernel
          path: |
            out/Image
            out/sm8650-oneplus-giulia.dtb
            out/*-giulia-modules.tar.gz
